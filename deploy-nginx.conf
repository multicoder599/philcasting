# /etc/nginx/sites-available/philcasting
# sudo ln -s /etc/nginx/sites-available/philcasting /etc/nginx/sites-enabled/
# sudo certbot --nginx -d api.philcasting.com -d admin.philcasting.com

server {
    listen 80;
    server_name api.philcasting.com;

    location / {
        proxy_pass http://127.0.0.1:4030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        client_max_body_size 25m;   # needed for KYC document uploads
    }
}

server {
    listen 80;
    server_name admin.philcasting.com;
    root /home/devuser/philcasting/backend/admin-public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
}
